name: 检查并发布独立 SBProxy 核心

on:
  # Scheduled by Daily-Maintenance-Queue. No duplicate cron here.
  workflow_dispatch:
    inputs:
      channel:
        description: 上游发布通道
        type: choice
        options: [stable, alpha]
        default: stable
      upstream_version:
        description: 指定补发的上游版本（如 1.15.0-alpha.12）；留空检查最新版本
        type: string
        default: ''
      package_revision:
        description: APK 修订号；补发固件恢复包时匹配原包修订号
        type: string
        default: '1'
      build_apks:
        description: 同时更新滚动 APK 发布（独立核心始终构建）
        default: true
        type: boolean
  workflow_call:
    inputs:
      channel:
        type: string
        default: stable
        required: false
      upstream_version:
        type: string
        default: ''
        required: false
      package_revision:
        type: string
        default: '1'
        required: false
      build_apks:
        required: false
        default: true
        type: boolean
    outputs:
      package_changed:
        value: ${{ jobs.publish.outputs.package_changed }}
      packages:
        value: ${{ jobs.publish.outputs.packages }}
      source_sha:
        value: ${{ jobs.publish.outputs.source_sha }}

permissions:
  contents: write

concurrency:
  group: sbproxy-core-release-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      pin_needed: ${{ steps.resolve.outputs.pin_needed }}
      publish_needed: ${{ steps.resolve.outputs.publish_needed }}
      version: ${{ steps.resolve.outputs.version }}
      revision: ${{ steps.resolve.outputs.revision }}
      tag: ${{ steps.resolve.outputs.tag }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      fingerprint: ${{ steps.resolve.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 检查所选通道及构建输入变更
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_CHANNEL: ${{ inputs.channel || 'stable' }}
          REQUESTED_VERSION: ${{ inputs.upstream_version }}
          REQUESTED_REVISION: ${{ inputs.package_revision || '1' }}
        run: |
          python3 sing-box/tests/test-core-release.py
          python3 sing-box/tests/test-core-export.py
          python3 sing-box/tests/test-package-sources.py
          python3 luci-app-sbproxy/tests/test-core-switch.py
          sh sing-box/tests/static-tailscale-route-api.sh
          python3 .github/scripts/core-release.py resolve "$CORE_CHANNEL" "$REQUESTED_VERSION" "$REQUESTED_REVISION"
          {
            echo '### Sing-Box 核心检查'
            echo "- 上游版本：$(awk -F= '$1 == "version" { print $2 }' "$GITHUB_OUTPUT")"
            echo "- 是否构建：$(awk -F= '$1 == "build" { print $2 }' "$GITHUB_OUTPUT")"
            echo "- 发布标签：$(awk -F= '$1 == "tag" { print $2 }' "$GITHUB_OUTPUT")"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    uses: ./.github/workflows/Build-APK-Packages.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      packages: sing-box
      core_version: ${{ needs.resolve.outputs.version }}
      core_revision: ${{ needs.resolve.outputs.revision }}

  publish:
    needs: [resolve, build]
    if: >-
      always() && needs.resolve.result == 'success' &&
      needs.resolve.outputs.publish_needed == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: repository-maintenance
      cancel-in-progress: false
    outputs:
      package_changed: ${{ steps.commit.outputs.changed }}
      packages: ${{ steps.commit.outputs.packages }}
      source_sha: ${{ steps.commit.outputs.commit_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.resolve.outputs.version }}
      REVISION: ${{ needs.resolve.outputs.revision }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
      FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
      CORE_CHANNEL: ${{ inputs.channel || 'stable' }}
      REQUESTED_VERSION: ${{ inputs.upstream_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        if: needs.resolve.outputs.build == 'true'
        with:
          pattern: sbproxy-core-*
          merge-multiple: true
          path: core-release
      - name: 校验双架构产物并生成清单
        if: needs.resolve.outputs.build == 'true'
        run: |
          python3 .github/scripts/core-release.py assemble core-release "$VERSION" "$REVISION" "$FINGERPRINT" "$SOURCE_SHA"
          git archive --format=tar.gz --output=core-release/sbproxy-core-build-source.tar.gz \
            "$SOURCE_SHA" sing-box .github/scripts .github/workflows
          cd core-release
          sha256sum sbproxy-core-build-source.tar.gz >> SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: 发布独立历史版本（不覆盖已有 Release）
        if: needs.resolve.outputs.build == 'true'
        run: |
          release_flags=(--latest)
          if [[ -n "$REQUESTED_VERSION" ]]; then release_flags=(--latest=false); fi
          if [[ "$CORE_CHANNEL" == alpha ]]; then release_flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" core-release/* --target "$SOURCE_SHA" \
            --title "SBProxy core $VERSION" "${release_flags[@]}" \
            --notes "SBProxy full core, ARM64/AMD64. Includes Tailscale route API and Linux policy routing patches. Source: $SOURCE_SHA; upstream: SagerNet/sing-box v$VERSION. See core-manifest.json for checksums and build metadata. The newest 5 releases in each channel are kept for online rollback. Channel: $CORE_CHANNEL."
      - name: 恢复已发布版本的清单
        if: needs.resolve.outputs.build == 'false'
        run: gh release download "$RELEASE_TAG" --pattern core-manifest.json --dir core-release
      - name: 发布成功后更新固件下载锁定版本
        if: needs.resolve.outputs.pin_needed == 'true'
        id: commit
        env:
          PACKAGE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source .github/scripts/ci-common.sh
          ci_sync_branch "$PACKAGE_BRANCH"
          python3 .github/scripts/core-release.py pin core-release/core-manifest.json
          ci_commit_and_push "$PACKAGE_BRANCH" "chore: pin SBProxy core $VERSION" \
            sing-box/Makefile sing-box/core-prebuilt.mk

  retain:
    name: 每个通道最多保留 5 个核心版本
    needs: [resolve, publish]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: repository-maintenance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 清理各通道历史核心 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/core-release.py retain

  rolling_packages:
    needs: publish
    if: needs.publish.outputs.package_changed == 'true' && inputs.build_apks
    uses: ./.github/workflows/Build-APK-Packages.yml
    with:
      source_sha: ${{ needs.publish.outputs.source_sha }}
      packages: sing-box
