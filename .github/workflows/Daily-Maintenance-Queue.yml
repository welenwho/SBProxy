name: 每日维护任务队列

on:
  workflow_dispatch:
  schedule:
    # GitHub 会在整点高峰丢弃 schedule。错开分钟，并每天检查两次，
    # 避免一次丢弃就错过上游稳定版。对应北京时间 02:17 和 14:47。
    - cron: '17 18 * * *'
    - cron: '47 6 * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: daily-maintenance-queue
  cancel-in-progress: false

jobs:
  cleanup:
    name: CI 清理
    uses: ./.github/workflows/Cleanup-CI-History.yml

  singbox:
    name: Sing-Box 更新
    needs: cleanup
    if: ${{ always() }}
    uses: ./.github/workflows/Update-Sing-Box.yml
    with:
      build_apks: false

  sbproxy:
    name: SBProxy 更新
    needs: singbox
    if: ${{ always() }}
    uses: ./.github/workflows/Update-SBProxy.yml
    with:
      build_apks: false

  translation:
    name: 翻译维护
    needs: sbproxy
    # Translation maintenance must not run after a failed SBProxy update.
    # Running it unconditionally allowed a failed/partial source update to
    # trigger an incomplete scan and publish translation deletions.
    if: ${{ needs.sbproxy.result == 'success' }}
    uses: ./.github/workflows/Rescan-Translation.yml
    with:
      build_apks: false

  build:
    name: 编译本轮变更的软件包
    needs:
      - singbox
      - sbproxy
      - translation
    if: >-
      always() && (
        needs.singbox.outputs.packages != '' ||
        needs.sbproxy.outputs.packages != '' ||
        needs.translation.outputs.packages != ''
      )
    uses: ./.github/workflows/Build-APK-Packages.yml
    with:
      source_sha: >-
        ${{ needs.translation.outputs.source_sha || needs.sbproxy.outputs.source_sha || needs.singbox.outputs.source_sha }}
      packages: >-
        ${{ needs.singbox.outputs.packages }},${{ needs.sbproxy.outputs.packages }},${{ needs.translation.outputs.packages }}
