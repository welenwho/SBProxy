name: 每日检查并更新 SBProxy 数据

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      package_changed:
        description: 内置规则数据是否写入了新的匹配集合
        value: ${{ jobs.update.outputs.package_changed }}
      packages:
        description: 数据更新不发布插件包，因此始终为空
        value: ${{ jobs.update.outputs.packages }}
      source_sha:
        description: 更新后的精确提交 SHA
        value: ${{ jobs.update.outputs.source_sha }}

permissions:
  contents: write

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

jobs:
  update:
    name: 检查并更新 SBProxy 数据
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_changed: ${{ steps.package_commit.outputs.changed }}
      packages: ${{ steps.package_commit.outputs.packages }}
      source_sha: ${{ steps.package_commit.outputs.commit_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出插件仓库
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: 同步默认分支
        env:
          PACKAGE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          source .github/scripts/ci-common.sh
          ci_sync_branch "$PACKAGE_BRANCH"

      - name: 安装数据更新工具
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends curl jq unzip

      - name: 确定规则校验工具缓存版本
        id: rule_tool
        run: bash .github/scripts/prepare-rule-set-tool.sh resolve

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sbproxy-rule-cache
          key: sbproxy-rule-tool-${{ runner.os }}-${{ steps.rule_tool.outputs.version }}-${{ steps.rule_tool.outputs.sha256 }}

      - name: 准备与锁定核心版本一致的规则校验工具
        run: bash .github/scripts/prepare-rule-set-tool.sh

      - name: 检查并更新 SBProxy 数据
        id: resources
        run: .github/scripts/update-sbproxy-geodata.sh

      - name: 提交数据更新
        id: package_commit
        env:
          PACKAGE_BRANCH: ${{ github.event.repository.default_branch }}
          RESOURCE_VERSION: ${{ steps.resources.outputs.version }}
        run: |
          source .github/scripts/ci-common.sh
          ci_commit_and_push \
            "$PACKAGE_BRANCH" \
            "chore: 更新 SBProxy 数据至 $RESOURCE_VERSION" \
            luci-app-sbproxy
          # Embedded data stays in git for the next real plugin release.
          # Publishing the same PKG_RELEASE would replace recovery assets
          # without giving devices a new version to install.
          ci_write_output packages ''
          ci_write_output packages_display ''
